<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Mening Kanban Doskam</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f5f7; margin: 0; padding: 20px; }
        h1, h2, h3 { color: #172b4d; }

        /* Login qismi dizayni */
        #login-section { max-width: 300px; margin: 100px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #dfe1e6; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0052cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0047b3; }

        /* Doska qismi dizayni */
        #board-section { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        .kanban-board { display: flex; gap: 20px; align-items: flex-start; }
        .column { flex: 1; background: #ebecf0; border-radius: 8px; padding: 15px; min-height: 400px; }
        .column h3 { margin-top: 0; font-size: 16px; text-transform: uppercase; color: #5e6c84; }

        /* Vazifa (Task) kartochkasi */
        .task-card { background: white; padding: 15px; border-radius: 4px; box-shadow: 0 1px 2px rgba(9,30,66,0.25); margin-bottom: 10px; cursor: pointer; transition: transform 0.2s; }
        .task-card:hover { transform: translateY(-2px); }
        .task-title { font-weight: bold; margin-bottom: 5px; color: #172b4d;}
        .task-priority { font-size: 12px; padding: 3px 6px; border-radius: 3px; display: inline-block; text-transform: capitalize; }
        .priority-high { background: #ffebe6; color: #bf2600; }
        .priority-medium { background: #fff0b3; color: #ff8b00; }
        .priority-low { background: #e3fcef; color: #006644; }
    </style>
</head>
<body>

    <!-- LOGIN QISMI -->
    <div id="login-section">
        <h2>Tizimga kirish</h2>
        <input type="text" id="username" placeholder="Login">
        <input type="password" id="password" placeholder="Parol">
        <button onclick="login()">Kirish</button>
        <p id="login-error" style="color: red; font-size: 14px;"></p>
    </div>

    <!-- KANBAN DOSKA QISMI -->
    <div id="board-section">
        <div class="header">
            <div>
                <h1>Mening Loyihalarim</h1>
                <select id="project-select" onchange="loadTasks()">
                    <option value="">Loyiha tanlang...</option>
                </select>
            </div>
            <button onclick="logout()" style="width: auto; background-color: #ff5630;">Chiqish (Logout)</button>
        </div>

        <div class="kanban-board">
            <!-- ToDo ustuni -->
            <div class="column" id="col-todo">
                <h3>Vazifalar (ToDo)</h3>
                <div class="tasks-container"></div>
            </div>

            <!-- In Progress ustuni -->
            <div class="column" id="col-in_progress">
                <h3>Jarayonda (In Progress)</h3>
                <div class="tasks-container"></div>
            </div>

            <!-- Done ustuni -->
            <div class="column" id="col-done">
                <h3>Bajarildi (Done)</h3>
                <div class="tasks-container"></div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT: Backend bilan gaplashadigan qism -->
    <script>
        const API_BASE = 'http://127.0.0.1:8000/api/v1';

        // Sahifa yonganda token bor-yo'qligini tekshiramiz
        window.onload = () => {
            if (localStorage.getItem('access_token')) {
                showBoard();
            }
        };

        // 1. LOGIN FUNKSIYASI
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorText = document.getElementById('login-error');

            try {
                const response = await fetch(`${API_BASE}/accounts/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    errorText.innerText = "";
                    showBoard();
                } else {
                    errorText.innerText = "Login yoki parol noto'g'ri!";
                }
            } catch (err) {
                errorText.innerText = "Serverga ulanib bo'lmadi. Django yoniqmi?";
            }
        }

        // 2. EKRANNI ALMASHTIRISH (Login -> Doska)
        function showBoard() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('board-section').style.display = 'block';
            loadProjects();
        }

        // CHIQISH
        function logout() {
            localStorage.removeItem('access_token');
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('board-section').style.display = 'none';
        }

        // API ga so'rov yuborish uchun yordamchi funksiya (Tokenni avtomat qo'shadi va xatolarni ushlaydi)
        async function fetchAPI(url) {
            const token = localStorage.getItem('access_token');
            const response = await fetch(url, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            // Agar token eskirgan (401) yoki ruxsat yo'q (403) bo'lsa:
            if (response.status === 401 || response.status === 403) {
                logout();
                alert("Sessiya tugadi (Token yaroqsiz). Iltimos, qayta tizimga kiring.");
                return null; // Xatoni oldini olish uchun null qaytaramiz
            }
            return response.json();
        }

        // 3. LOYIHALARNI YUKLASH (GET /projects/)
        async function loadProjects() {
            try {
                const responseData = await fetchAPI(`${API_BASE}/apps/projects/`);
                if (!responseData) return; // Agar token xato bo'lib null qaytgan bo'lsa, to'xtaymiz

                // Agar Django pagination yoqilgan bo'lsa, .results ichidan olamiz
                const projects = responseData.results ? responseData.results : responseData;

                const select = document.getElementById('project-select');
                select.innerHTML = '<option value="">Loyiha tanlang...</option>';

                // Haqiqatan ham massiv (array) kelganligiga ishonch hosil qilamiz
                if (!Array.isArray(projects)) {
                    console.error("Xato: Loyihalar ro'yxati kelmadi!", responseData);
                    return;
                }

                projects.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p.id;
                    option.innerText = p.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("Loyihalarni yuklashda xatolik:", error);
            }
        }

        // 4. VAZIFALARNI YUKLASH
        async function loadTasks() {
            const projectId = document.getElementById('project-select').value;
            if (!projectId) return;

            // Uchala ustunni tozalaymiz
            document.querySelector('#col-todo .tasks-container').innerHTML = '';
            document.querySelector('#col-in_progress .tasks-container').innerHTML = '';
            document.querySelector('#col-done .tasks-container').innerHTML = '';

            try {
                // E'tibor bering: url backendga moslangan (task/task/)
                const responseData = await fetchAPI(`${API_BASE}/task/task/?project=${projectId}`);
                if (!responseData) return; // Token xatoligini oldini olish

                // PAGINATION MUAMMOSI YECHIMI:
                const tasks = responseData.results ? responseData.results : responseData;

                if (!Array.isArray(tasks)) {
                    console.error("Xato! API dan vazifalar massivi kelmadi. Kelgan ma'lumot:", responseData);
                    return;
                }

                tasks.forEach(task => {
                    const card = document.createElement('div');
                    card.className = 'task-card';
                    card.innerHTML = `
                        <div class="task-title">${task.title}</div>
                        <div class="task-priority priority-${task.priority}">${task.priority}</div>
                    `;

                    if (task.status === 'todo') {
                        document.querySelector('#col-todo .tasks-container').appendChild(card);
                    } else if (task.status === 'in_progress') {
                        document.querySelector('#col-in_progress .tasks-container').appendChild(card);
                    } else if (task.status === 'done') {
                        document.querySelector('#col-done .tasks-container').appendChild(card);
                    }
                });
            } catch (error) {
                console.error("Vazifalarni yuklashda xatolik:", error);
            }
        }
    </script>
</body>
</html>
